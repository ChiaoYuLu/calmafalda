<nav class="navbar">

  <a routerLink="/" class="logo">
    calmafalda
  </a>

  <div class="nav-links">
    <a routerLink="/" fragment="services">
      {{ 'nav.services' | translate }}
    </a>

    <a routerLink="/" fragment="reviews">
      {{ 'nav.reviews' | translate }}
    </a>

    <a routerLink="/about">
      {{ 'nav.about' | translate }}
    </a>

    <a routerLink="/gallery">
      {{ 'nav.gallery' | translate }}
    </a>

    <a routerLink="/links">
      {{ 'nav.links' | translate }}
    </a>

    <a routerLink="/" fragment="contact" class="contact-button">
      {{ 'nav.contact' | translate }}
    </a>

  <div class="language-selector">
    <button
      type="button"
      (click)="changeLanguage('en')"
      [class.active]="false">
      EN

    <span>|</span>

    <button
      type="button"
      (click)="changeLanguage('pt')">
      PT
    </button>
  </div>
